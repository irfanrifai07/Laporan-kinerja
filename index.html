<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Full Page WebApp</title>
  <style>
    /* Reset margin dan padding default */
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    /* Container penampung iframe */
    .webapp-container {
      position: fixed;
      inset: 0; /* Menggantikan top, left, bottom, right: 0 */
      width: 100vw;
      height: 100vh;
      border: none;
      margin: 0;
      padding: 0;
      overflow: hidden;
      z-index: 999999;
      background-color: #ffffff;
    }

    /* Style untuk iframe */
    .webapp-container iframe {
      width: 100%;
      height: 100%;
      border: 0;
      margin: 0;
      padding: 0;
      display: block;
    }
  </style>
</head>
<body>

  <div class="webapp-container">
    <iframe 
      src="https://script.google.com/macros/s/AKfycbwwy2B2Z45JllUyDoNFv-54AtPWhfkp73Phznyd7PFFtwqVLPoEcDhkf9lnw_3BfCNO/exec" 
      allowfullscreen="true">
    </iframe>
  </div>

</body>
</html>
