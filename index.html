<!-- Kode HTML & CSS Full Page Responsive -->
<style>
  /* Menghilangkan margin dan padding bawaan */
  html, body {
    margin: 0 !important;
    padding: 0 !important;
    height: 100% !important;
    width: 100% !important;
    overflow: hidden;
  }

  /* Container penampung iframe */
  .webapp-container {
    position: fixed;
    top: 0;
    left: 0;
    bottom: 0;
    right: 0;
    width: 100vw;
    height: 100vh;
    border: none;
    margin: 0;
    padding: 0;
    overflow: hidden;
    z-index: 999999;
    background-color: #ffffff;
  }

  /* Style untuk iframe */
  .webapp-container iframe {
    width: 100%;
    height: 100%;
    border: 0;
    margin: 0;
    padding: 0;
    display: block;
  }
</style>

<div class="webapp-container">
  <iframe 
    src="https://script.google.com/macros/s/AKfycbwwy2B2Z45JllUyDoNFv-54AtPWhfkp73Phznyd7PFFtwqVLPoEcDhkf9lnw_3BfCNO/exec" 
    allowfullscreen="true" 
    webkitallowfullscreen="true" 
    mozallowfullscreen="true">
  </iframe>
</div>
