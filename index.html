<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Web App Container</title>
  <style>
    /* 1. Pengaturan Dasar Layout */
    html, body {
      margin: 0 !important;
      padding: 0 !important;
      width: 100% !important;
      height: 100% !important;
      height: 100dvh !important; /* Adaptif untuk layar mobile modern */
      overflow: hidden !important;
      background-color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    /* 2. Container Penampung Utama */
    .webapp-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      border: none;
      margin: 0;
      padding: 0;
      overflow: hidden;
      z-index: 999999;
      background-color: #ffffff;
    }

    /* 3. Animasi Loading Spinner (Tampil saat memuat) */
    .loader-wrapper {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 15px;
      z-index: 1;
    }

    .spinner {
      width: 45px;
      height: 45px;
      border: 4px solid #e2e8f0;
      border-top: 4px solid #3b82f6;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    .loader-text {
      color: #64748b;
      font-size: 14px;
      font-weight: 500;
      letter-spacing: 0.5px;
      animation: pulse 1.5s ease-in-out infinite;
    }

    /* 4. Style untuk Iframe + Animasi Masuk */
    .webapp-container iframe {
      width: 100%;
      height: 100%;
      border: 0;
      margin: 0;
      padding: 0;
      display: block;
      position: relative;
      z-index: 2; /* Berada di atas loader */
      background: transparent;
      
      /* Animasi Slide-Up & Fade-In saat iframe selesai dimuat */
      animation: slideUpFade 0.7s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    /* 5. Keyframes (Definisi Gerakan Animasi) */
    
    /* Animasi Putaran Spinner */
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    /* Animasi Berdenyut Teks Loading */
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }

    /* Animasi Kemunculan Web App (Slide Up + Fade In) */
    @keyframes slideUpFade {
      from {
        opacity: 0;
        transform: translateY(20px) scale(0.99);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }
  </style>
</head>
<body>

  <div class="webapp-container">
    <!-- Indikator Loading dengan Animasi Spinner -->
    <div class="loader-wrapper">
      <div class="spinner"></div>
      <div class="loader-text">Memuat Aplikasi...</div>
    </div>

    <!-- Frame Google Apps Script -->
    <iframe 
      src="https://script.google.com/macros/s/AKfycbwwy2B2Z45JllUyDoNFv-54AtPWhfkp73Phznyd7PFFtwqVLPoEcDhkf9lnw_3BfCNO/exec" 
      allow="geolocation; microphone; camera; clipboard-write"
      allowfullscreen="true">
    </iframe>
  </div>

</body>
</html>
